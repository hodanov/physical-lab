[project]
name = "physical-lab"
version = "0.1.0"
description = "Code-CAD sources and tooling for physical-lab products"
requires-python = ">=3.14,<3.15"
dependencies = [
  "build123d>=0.9",
]

[project.scripts]
tsugu65-build = "tsugu65.build:main"
tsugu65-drawings = "tsugu65.techdraw:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["products/keyboard/tsugu-65/cad/source/tsugu65"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["products"]
explicit_package_bases = true
mypy_path = "products/keyboard/tsugu-65/cad/source"

[[tool.mypy.overrides]]
module = ["FreeCAD", "Import"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["products/keyboard/tsugu-65/cad/source/tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
# FreeCAD runs drawing scripts with its bundled Python 3.11.
per-file-target-version = { "products/*/*/drawings/*.py" = "py311" }

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N",
  "S",     # flake8-bandit: security
  "PTH",   # prefer pathlib over os.path
  "PL",    # pylint
  "PERF",  # performance anti-patterns
  "C4",    # comprehensions
  "RET",   # return statements
  "PT",    # pytest style
  "ARG",   # unused arguments
  "ERA",   # commented-out code
  "PIE", "FURB", "A", "LOG",
]

[tool.ruff.lint.per-file-ignores]
# pytest relies on assert, and tests compare against literal expected values.
"**/tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["tsugu65"]
