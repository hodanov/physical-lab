[project]
name = "physical-lab"
version = "0.1.0"
description = "Code-CAD sources and tooling for physical-lab products"
requires-python = ">=3.11,<3.12"
dependencies = [
  "build123d>=0.9",
]

[project.scripts]
tsugu65-build = "tsugu65.build:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["products/keyboard/tsugu-65/cad/source/tsugu65"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["products"]
explicit_package_bases = true
mypy_path = "products/keyboard/tsugu-65/cad/source"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["products/keyboard/tsugu-65/cad/source/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
